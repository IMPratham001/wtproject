<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inquiries | Scara Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="admin-nav">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="admin-dashboard.html" class="navbar-brand mb-0">SCA<span class="brand-accent">RA</span> ADMIN</a>
    <button id="logoutBtn" class="btn btn-hero-outline btn-sm">Log Out</button>
  </div>
</nav>

<div class="container admin-content">
  <a href="admin-dashboard.html" class="admin-back-link mb-4 d-inline-block">&larr; Dashboard</a>
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h2 class="admin-section-title mb-0">Inquiries</h2>
    <button type="button" id="clearInquiriesBtn" class="btn btn-hero-outline btn-sm">Clear All</button>
  </div>

  <div class="table-responsive">
    <table class="table admin-table">
      <thead><tr><th>Type</th><th>Name</th><th>Email</th><th>Message</th><th>Fee</th><th>Date</th><th></th></tr></thead>
      <tbody id="inquiriesTableBody"></tbody>
    </table>
    <p id="noInquiries" class="admin-empty-note">No inquiries yet.</p>
  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
