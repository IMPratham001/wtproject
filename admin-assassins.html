<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Assassins | Scara Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="admin-nav">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="admin-dashboard.html" class="navbar-brand mb-0">SCA<span class="brand-accent">RA</span> ADMIN</a>
    <button id="logoutBtn" class="btn btn-hero-outline btn-sm">Log Out</button>
  </div>
</nav>

<div class="container admin-content">
  <a href="admin-dashboard.html" class="admin-back-link mb-4 d-inline-block">&larr; Dashboard</a>
  <h2 class="admin-section-title">Manage Assassins</h2>

  <form id="assassinForm" class="admin-form-row">
    <input type="hidden" id="assassinId">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Name</label>
        <input type="text" id="assassinName" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Specialization</label>
        <input type="text" id="assassinSpec" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Kills</label>
        <input type="number" id="assassinKills" class="form-control" required min="0">
      </div>
      <div class="col-md-4">
        <label class="form-label">Success Rate</label>
        <input type="text" id="assassinSuccess" class="form-control" placeholder="99%" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Contract Fee</label>
        <input type="text" id="assassinFee" class="form-control" placeholder="$1,000,000" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Status</label>
        <select id="assassinStatus" class="form-select">
          <option>ACTIVE</option>
          <option>STANDBY</option>
        </select>
      </div>
      <div class="col-12 d-flex gap-2">
        <button type="submit" class="btn btn-hero-primary" id="assassinSaveBtn">Add Assassin</button>
        <button type="button" class="btn btn-hero-outline" id="assassinCancelBtn" style="display:none">Cancel</button>
      </div>
    </div>
  </form>

  <div class="table-responsive">
    <table class="table admin-table">
      <thead><tr><th>Name</th><th>Specialization</th><th>Kills</th><th>Success</th><th>Fee</th><th>Status</th><th></th></tr></thead>
      <tbody id="assassinsTableBody"></tbody>
    </table>
  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
