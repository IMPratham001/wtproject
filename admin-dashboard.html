<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Scara</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="admin-nav">
  <div class="container d-flex justify-content-between align-items-center">
    <span class="navbar-brand mb-0">SCA<b class="brand-accent">RA</b></span>
    <button id="logoutBtn" class="btn btn-hero-outline btn-sm">Log Out</button>
  </div>
</nav>

<div class="container admin-content">
  <div class="row g-3 mb-5">
    <div class="col-6 col-md-4">
      <div class="admin-stat-card">
        <div class="admin-stat-value" id="statAssassins">0</div>
        <div class="admin-stat-label">Assassins</div>
      </div>
    </div>
    <div class="col-6 col-md-4">
      <div class="admin-stat-card">
        <div class="admin-stat-value" id="statContracts">0</div>
        <div class="admin-stat-label">Contracts</div>
      </div>
    </div>
    <div class="col-6 col-md-4">
      <div class="admin-stat-card">
        <div class="admin-stat-value" id="statInquiries">0</div>
        <div class="admin-stat-label">Inquiries</div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-4">
      <a href="admin-assassins.html" class="admin-hub-card">
        <i class="bi bi-person-badge" aria-hidden="true"></i>
        <h3>Manage Assassins</h3>
        <p>Add, edit, and remove roster entries.</p>
      </a>
    </div>
    <div class="col-md-4">
      <a href="admin-contracts.html" class="admin-hub-card">
        <i class="bi bi-map" aria-hidden="true"></i>
        <h3>Manage Contracts</h3>
        <p>Add, edit, and remove active contracts.</p>
      </a>
    </div>
    <div class="col-md-4">
      <a href="admin-inquiries.html" class="admin-hub-card">
        <i class="bi bi-inbox" aria-hidden="true"></i>
        <h3>Inquiries</h3>
        <p>View and clear hire requests and messages.</p>
      </a>
    </div>
  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
